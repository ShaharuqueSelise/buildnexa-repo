server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # nginx's built-in type list has no .mjs, so it would send the pdf.js worker
  # (assets/pdf.worker.min-*.mjs) as application/octet-stream and browsers refuse
  # to run it as a module: drawings and PDF previews then show "couldn't be shown".
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
