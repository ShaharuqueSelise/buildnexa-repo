<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Buildnexa</title>
</head>
<body style="margin:0;padding:0;background:#f1f4f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f4f9;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
        <tr>
          <td style="padding:18px 24px;border-bottom:1px solid #e2e8f0;">
            <span style="display:inline-block;background:#124191;color:#ffffff;font-weight:700;font-size:13px;border-radius:6px;padding:4px 8px;">Buildnexa</span>
            <span style="color:#64748b;font-size:13px;padding-left:8px;">{{ProjectName}}</span>
          </td>
        </tr>
        <tr>
          <td style="padding:24px;">
            <p style="margin:0 0 12px;font-size:14px;color:#64748b;">Hello {{DisplayName}},</p>
            <h1 style="margin:0 0 10px;font-size:20px;line-height:1.3;color:#0f172a;">{{Heading}}</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.5;color:#334155;">{{Text}}</p>
            <a href="{{ButtonUrl}}" style="display:inline-block;background:#124191;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;border-radius:8px;padding:11px 18px;">{{ButtonLabel}}</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.5;color:#64748b;">
            You get this email because you are on this project's team. You can turn emails off in your
            <a href="{{SettingsUrl}}" style="color:#124191;">notification settings</a>; the bell in the app keeps working.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
